server {
    listen 80;
    client_max_body_size 50M;

    # MAIN FRONTEND
    location / {
        root /usr/share/nginx/html/main;
        index index.html;
        try_files $uri /index.html;
    }

    # STUDENT
    location /student/ {
        alias /usr/share/nginx/html/student/;
        index index.html;
        try_files $uri /index.html;
    }

    # TEACHER
    location /teacher/ {
        alias /usr/share/nginx/html/teacher/;
        index index.html;
        try_files $uri /index.html;
    }

    # DJANGO API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
    }

    # STATIC
    location /static/ {
        alias /static/;
    }

    # ── MEDIA ──────────────────────────────────────────────────────────────
    # This used to be one blanket `location /media/ { alias /media/; }` —
    # every file under MEDIA_ROOT served directly, unauthenticated, no
    # matter what config/media_security.py's _RULES table said a path
    # needed. That table's whole point is moot if nginx never consults it.
    #
    # These PUBLIC blocks are the ONLY things nginx is allowed to serve
    # directly, and they must mirror config/media_security.py's PUBLIC
    # entries exactly (that Python table has no way to reach nginx's config,
    # so the two are kept in sync by hand — see that file's own comment).
    # Everything else falls through to the deny-by-default block at the
    # bottom: a real client never legitimately requests /media/<private path>
    # directly anyway (SecureLocalStorage.url() points those at
    # /api/media/secure/<name> instead, which is the /api/ proxy above,
    # authenticated by Django, and reaches the actual bytes via the
    # internal-only /internal-media/ location further below).
    #
    # `teachers/` (bio photo) is public, but several of its own subpaths are
    # NOT (KYC docs, signed agreements, application videos) — nginx resolves
    # overlapping prefix locations by picking the LONGEST match regardless of
    # declaration order, so each private teachers/* subpath below only has to
    # be its own explicit deny block to win over the shorter public one.
    # (This is the exact same bug class media_security.py's own docstring
    # warns about — bare "teachers/" silently swallowing "teachers/certificates/"
    # — just on the nginx side instead of the Python side.)

    location /media/content/                    { alias /media/content/; }
    location /media/subjects/                    { alias /media/subjects/; }
    location /media/courses/thumbnails/          { alias /media/courses/thumbnails/; }
    location /media/boards/logos/                { alias /media/boards/logos/; }
    location /media/counselors/photos/           { alias /media/counselors/photos/; }
    location /media/counseling/guides/           { alias /media/counseling/guides/; }
    location /media/skills/marketing/            { alias /media/skills/marketing/; }
    location /media/skills/courses/covers/       { alias /media/skills/courses/covers/; }
    location /media/skills/categories/           { alias /media/skills/categories/; }
    location /media/skills/experts/              { alias /media/skills/experts/; }
    location /media/teachers/skills/images/      { alias /media/teachers/skills/images/; }
    # BLANK agreement templates an admin imported — read during signup before
    # the applicant's account exists. Distinct from /media/teachers/agreements/
    # (a specific person's SIGNED copy), which is denied below.
    location /media/agreements/letters/          { alias /media/agreements/letters/; }

    # Private teachers/* subpaths — must stay ahead of the public bare
    # "teachers/" block below by being longer/more specific, not by order.
    location /media/teachers/certificates/       { return 403; }
    location /media/teachers/id_proofs/          { return 403; }
    location /media/teachers/agreements/         { return 403; }
    location /media/teachers/skills/videos/      { return 403; }
    location /media/teachers/skills/files/       { return 403; }

    # Public bio photo — shorter prefix, only wins for paths not already
    # claimed by one of the private blocks above.
    location /media/teachers/                    { alias /media/teachers/; }

    # Deny-by-default: any /media/ path not explicitly whitelisted above
    # (study materials, ID proofs, receipts, submissions, chat attachments,
    # guardian-verification docs, session files, forum attachments, explore
    # documents, etc.) — these are only ever reachable through the
    # authenticated /api/media/secure/ endpoint.
    location /media/ {
        return 403;
    }

    # Internal-only target for Django's X-Accel-Redirect (see
    # config/media_views.py's secure_media_view). `internal;` makes this
    # location unreachable from any direct client request — nginx only
    # honours it when the response came from an upstream's X-Accel-Redirect
    # header, which only the authenticated /api/ proxy above can produce.
    # This location did not exist at all before this fix, which meant
    # secure_media_view's X-Accel-Redirect always 404'd — the intended
    # "authenticate then hand off to nginx" path was completely broken,
    # not just insecure.
    location /internal-media/ {
        internal;
        alias /media/;
    }
}
